<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vuelos Cercanos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Rastreador de vuelos cercanos usando geolocalización y datos en vivo de OpenSky Network.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background:#0b1220; color:#e6edf3; }
  #map { height: 45vh; width: 100%; }
  header { padding: 12px 16px; background:#101a2b; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e2a3f;}
  header h1 { font-size: 16px; font-weight:600; }
  #status { font-size: 12px; color:#8ea3bd; }
  #refreshBtn { background:#1e3a5f; color:#e6edf3; border:none; padding:8px 12px; border-radius:8px; font-size:13px; }
  #locationHelp { display:none; padding: 16px; text-align:center; }
  #locationHelp p { color:#8ea3bd; font-size:13.5px; margin-bottom:12px; line-height:1.5; }
  #retryLocationBtn { background:#1e3a5f; color:#e6edf3; border:none; padding:10px 18px; border-radius:8px; font-size:14px; }
  #list { padding: 8px 12px 80px; overflow-y:auto; }
  .flight-card { background:#111c2e; border:1px solid #1e2a3f; border-radius:10px; padding:12px; margin-bottom:8px; }
  .flight-card .top { display:flex; justify-content:space-between; align-items:baseline; }
  .flight-card .callsign { font-weight:700; font-size:15px; }
  .flight-card .dist { color:#6fd38a; font-weight:600; font-size:14px; }
  .flight-card .details { color:#8ea3bd; font-size:12.5px; margin-top:4px; display:flex; gap:12px; flex-wrap:wrap;}
  .empty { text-align:center; color:#6b7f99; padding: 24px; font-size:14px; }
  .plane-icon { font-size: 18px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>✈️ Vuelos Cercanos</h1>
    <div id="status">Obteniendo ubicación...</div>
  </div>
  <button id="refreshBtn">Actualizar</button>
</header>
<div id="map"></div>
<div id="locationHelp">
  <p>Necesitamos tu ubicación para buscar vuelos cercanos. Si el navegador te pidió permiso y lo bloqueaste, habilítalo desde el ícono de candado/ajustes del sitio y vuelve a intentar.</p>
  <button id="retryLocationBtn">Reintentar</button>
</div>
<div id="list"><div class="empty">Esperando datos de vuelo...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { fetchNearbyFlights, renderFlightList, escapeHtml } from "./app-logic.js";

let map, planeMarkers = [];
let userLat = null, userLon = null;

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");
const mapEl = document.getElementById("map");
const locationHelpEl = document.getElementById("locationHelp");
const retryLocationBtn = document.getElementById("retryLocationBtn");

function initMap(lat, lon) {
  map = L.map("map").setView([lat, lon], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);
  L.circleMarker([lat, lon], { radius: 7, color: "#3b82f6", fillColor: "#3b82f6", fillOpacity: 0.8 }).addTo(map);
}

function renderMarkers(flights) {
  planeMarkers.forEach((m) => map.removeLayer(m));
  planeMarkers = [];
  flights.forEach((f) => {
    // f.track ya fue normalizado a número en app-logic.js (parseStates),
    // así que es seguro interpolarlo en el atributo style.
    const icon = L.divIcon({
      html: `<div class="plane-icon" style="transform: rotate(${f.track}deg)">✈️</div>`,
      className: "", iconSize: [24, 24]
    });
    const marker = L.marker([f.lat, f.lon], { icon }).addTo(map)
      .bindPopup(`<b>${escapeHtml(f.callsign)}</b><br>${f.dist.toFixed(1)} km · ${f.altitude ? Math.round(f.altitude) + "m" : ""}`);
    planeMarkers.push(marker);
  });
}

async function loadFlights() {
  if (userLat === null) return;
  statusEl.textContent = "Buscando aviones...";
  try {
    const flights = await fetchNearbyFlights(userLat, userLon);
    statusEl.textContent = `${flights.length} vuelos detectados · actualizado ${new Date().toLocaleTimeString()}`;
    renderFlightList(listEl, flights);
    renderMarkers(flights);
  } catch (err) {
    statusEl.textContent = "Error al obtener datos: " + err.message;
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadFlights);

function requestLocation() {
  locationHelpEl.style.display = "none";
  mapEl.style.display = "";
  statusEl.textContent = "Obteniendo ubicación...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      initMap(userLat, userLon);
      loadFlights();
      setInterval(loadFlights, 20000); // cada 20s, respeta límites de API anónima
    },
    (err) => {
      mapEl.style.display = "none";
      locationHelpEl.style.display = "block";
      if (err.code === err.PERMISSION_DENIED) {
        statusEl.textContent = "Permiso de ubicación denegado.";
      } else if (err.code === err.POSITION_UNAVAILABLE) {
        statusEl.textContent = "No se pudo determinar tu ubicación.";
      } else {
        statusEl.textContent = "Tiempo de espera agotado buscando tu ubicación.";
      }
    },
    { enableHighAccuracy: true }
  );
}

retryLocationBtn.addEventListener("click", requestLocation);
requestLocation();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((e) => console.error("SW error:", e));
  });
}
</script>
</body>
</html>
